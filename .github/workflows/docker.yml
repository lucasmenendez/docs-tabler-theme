name: Build and publish Docker image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lucasmenendez/docs-tabler-theme

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Platform tag
        id: pt
        run: |
          case "${{ matrix.platform }}" in
            linux/amd64) echo "arch=amd64" >> "$GITHUB_OUTPUT" ;;
            linux/arm64) echo "arch=arm64" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:build-${{ steps.pt.outputs.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Combine multi-arch manifests
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:latest" \
            -t "${{ env.IMAGE }}:${GITHUB_REF_NAME//\//-}" \
            -t "${{ env.IMAGE }}:${GITHUB_SHA::8}" \
            "${{ env.IMAGE }}:build-amd64" \
            "${{ env.IMAGE }}:build-arm64"
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} – {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  {% if page.description or site.description %}
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  {% endif %}
  {% if site.favicon %}
    {% assign favicon_ext = site.favicon | split: "." | last | downcase %}
    {% if favicon_ext == "svg" %}
      <link rel="icon" href="{{ site.favicon | relative_url }}" type="image/svg+xml">
    {% elsif favicon_ext == "png" %}
      <link rel="icon" href="{{ site.favicon | relative_url }}" type="image/png">
    {% else %}
      <link rel="icon" href="{{ site.favicon | relative_url }}" type="image/x-icon">
    {% endif %}
  {% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/tabler.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/theme.css' | relative_url }}">
  <script>
    (function () {
      var stored = localStorage.getItem("tblr-theme");
      var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-bs-theme", theme);
    })();
  </script>
</head>

<!-- Mobile TOC: full-width sticky toolbar pinned just below the fixed navbar.
   Must be a direct child of the tall <main> container so position: sticky
   has room to travel while the user scrolls. Populated by theme.js. -->
<div class="d-lg-none toc-mobile-toggle">
  <button type="button" class="toc-mobile-toggle-btn" data-bs-toggle="offcanvas" data-bs-target="#toc-offcanvas" aria-controls="toc-offcanvas">
    <i data-feather="list" aria-hidden="true"></i>
    <span>Table of contents</span>
  </button>
</div>
